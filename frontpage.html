<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CULTURE HIDES HERE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&text=这里藏着文化&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #f2f0eb;
    overflow: hidden;
    font-family: 'Roboto Flex', 'Arial Black', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .frame {
    height: 88vh;
    width: min(94vw, 72vh);
    display: flex;
    flex-direction: column;
  }

  .row { display: flex; min-height: 0; }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-width: 0;
    border: 1px solid rgba(17,17,17,0.0); /* 骨架线，JS控制透明度 */
  }

  .cell.inv { background: #111; }

  .g {
    color: #111;
    line-height: 0.84;
    font-variation-settings: 'wght' 500, 'wdth' 100;
    will-change: transform, font-variation-settings, opacity;
    user-select: none;
    transform-origin: 50% 55%;
    white-space: nowrap;
  }
  .cell.inv .g { color: #f2f0eb; }

  .g.cn {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    font-variation-settings: 'wght' 500;
    line-height: 1;
    font-size: 0.78em; /* 汉字是方块，同行里略小一号才平衡 */
  }

  /* 每行字号挂在格子上，字继承（汉字用em缩小才不会盖过字母） */
  .row:nth-child(1) .cell { font-size: 21vh; }
  .row:nth-child(2) .cell { font-size: 15vh; }
  .row:nth-child(3) .cell { font-size: 11.5vh; }
  .row:nth-child(4) .cell { font-size: 11vh; }
  .row:nth-child(5) .cell { font-size: 19vh; }
  .g { font-size: 1em; }

  /* 格子角标：尺寸标注 */
  .tag {
    position: absolute;
    top: 3px;
    left: 5px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: #111;
    opacity: 0;
    pointer-events: none;
  }
  .cell.inv .tag { color: #f2f0eb; }

  .hint {
    position: fixed;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 4px;
    color: #999;
    animation: breathe 2.4s ease-in-out infinite;
    user-select: none;
  }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:.9} }

  .debug {
    position: fixed; top: 12px; right: 12px;
    background: rgba(17,17,17,0.92); color: #eee;
    font-family: monospace; font-size: 11px;
    padding: 14px; border-radius: 6px;
    display: none; z-index: 99; width: 230px; cursor: default;
  }
  .debug.on { display: block; }
  .debug label { display: block; margin-top: 8px; color: #999; }
  .debug input[type=range] { width: 100%; }
  .debug .val { color: #fff; float: right; }
</style>
</head>
<body>

<!--
  布局：中英文按阅读顺序交错，两条线各自读得通
  行1: C U 这        行2: L T 里 U      行3: R E 藏 H I
  行4: D E 着 S 文   行5: H E 化 R E
  英文连读: CULTURE HIDES HERE ✓  中文连读: 这里藏着文化 ✓
-->
<div class="frame" id="frame">
  <div class="row" data-flex="1.5">
    <div class="cell"><span class="g">C</span><span class="tag"></span></div>
    <div class="cell"><span class="g">U</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">这</span><span class="tag"></span></div>
  </div>
  <div class="row" data-flex="1.15">
    <div class="cell inv"><span class="g">L</span><span class="tag"></span></div>
    <div class="cell"><span class="g">T</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">里</span><span class="tag"></span></div>
    <div class="cell"><span class="g">U</span><span class="tag"></span></div>
  </div>
  <div class="row" data-flex="1.0">
    <div class="cell"><span class="g">R</span><span class="tag"></span></div>
    <div class="cell"><span class="g">E</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">藏</span><span class="tag"></span></div>
    <div class="cell"><span class="g">H</span><span class="tag"></span></div>
    <div class="cell"><span class="g">I</span><span class="tag"></span></div>
  </div>
  <div class="row" data-flex="1.0">
    <div class="cell"><span class="g">D</span><span class="tag"></span></div>
    <div class="cell"><span class="g">E</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">着</span><span class="tag"></span></div>
    <div class="cell"><span class="g">S</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">文</span><span class="tag"></span></div>
  </div>
  <div class="row" data-flex="1.55">
    <div class="cell"><span class="g">H</span><span class="tag"></span></div>
    <div class="cell"><span class="g">E</span><span class="tag"></span></div>
    <div class="cell inv"><span class="g cn">化</span><span class="tag"></span></div>
    <div class="cell"><span class="g">R</span><span class="tag"></span></div>
    <div class="cell"><span class="g">E</span><span class="tag"></span></div>
  </div>
</div>

<div class="hint" id="hint">点击开启声音 CLICK FOR SOUND</div>

<div class="debug" id="debug">
  <b>DEBUG</b> (按D关闭)
  <label>灵敏度 <span class="val" id="v-sens"></span><input type="range" id="p-sens" min="0.5" max="3" step="0.1"></label>
  <label>起跳速度 <span class="val" id="v-atk"></span><input type="range" id="p-atk" min="0.05" max="0.9" step="0.05"></label>
  <label>回落速度 <span class="val" id="v-rel"></span><input type="range" id="p-rel" min="0.02" max="0.5" step="0.02"></label>
  <label>格子形变幅度 <span class="val" id="v-grid"></span><input type="range" id="p-grid" min="0" max="2.5" step="0.1"></label>
  <label>卡机频率 <span class="val" id="v-stuck"></span><input type="range" id="p-stuck" min="0" max="0.02" step="0.001"></label>
  <label>字重上限 <span class="val" id="v-wmax"></span><input type="range" id="p-wmax" min="600" max="1000" step="25"></label>
  <label>字宽幅度 <span class="val" id="v-wd"></span><input type="range" id="p-wd" min="0" max="90" step="5"></label>
  <label>节拍 BPM <span class="val" id="v-bpm"></span><input type="range" id="p-bpm" min="80" max="170" step="2"></label>
</div>

<script>
// ================= 参数 =================
var P = {
  sens: 1.6,
  atk: 0.45,
  rel: 0.10,
  grid: 1.2,    // 格子形变幅度
  stuck: 0.006, // 每帧每字卡死概率
  wMin: 280,
  wMax: 950,
  wd: 60,
  sy: 0.12,
  bpm: 126
};

// ================= 结构 =================
var frame = document.getElementById('frame');
var rows = Array.prototype.slice.call(frame.querySelectorAll('.row'));
var cells = Array.prototype.slice.call(frame.querySelectorAll('.cell'));
var glyphs = Array.prototype.slice.call(frame.querySelectorAll('.g'));
var N = glyphs.length;

// 每字状态
var state = glyphs.map(function (el, i) {
  return {
    el: el,
    cell: el.parentNode,
    tag: el.parentNode.querySelector('.tag'),
    isCN: el.classList.contains('cn'),
    v: 0,          // 平滑后能量
    band: 0,
    phase: Math.random() * Math.PI * 2,
    speed: 0.35 + Math.random() * 0.7,
    stuckUntil: 0, // 卡机到几时
    cellFlex: 1    // 格子当前flex
  };
});

// 行状态
var rowState = rows.map(function (el) {
  return { el: el, base: parseFloat(el.dataset.flex), v: 0, target: 0 };
});

// 频段分配：行越靠上下（字越大）吃越低的频段
(function () {
  var order = [];
  rows.forEach(function (row, ri) {
    Array.prototype.forEach.call(row.querySelectorAll('.g'), function (g) {
      order.push({ g: g, size: parseFloat(rowState[ri].base) });
    });
  });
  order.sort(function (a, b) { return b.size - a.size; });
  order.forEach(function (o, rank) {
    var s = state[glyphs.indexOf(o.g)];
    s.band = Math.floor((rank / (N - 1)) * 0.6 * 63);
  });
})();

// ================= 音频 =================
var audioOn = false, ctx, analyser, freq, master;
var barCount = 0, inBreak = false;
var kickPulse = 0; // 踢鼓瞬间脉冲，砸格子用

function startAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.7;
  analyser = ctx.createAnalyser();
  analyser.fftSize = 128;
  analyser.smoothingTimeConstant = 0.5;
  master.connect(analyser);
  analyser.connect(ctx.destination);
  freq = new Uint8Array(analyser.frequencyBinCount);

  var noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  function kick(t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
    g.gain.setValueAtTime(1.0, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.3);
    // 视觉脉冲（提前排的音符，延迟到发声时刻触发）
    setTimeout(function () { kickPulse = 1; }, Math.max(0, (t - ctx.currentTime) * 1000));
  }
  function hat(t, loud) {
    var s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(loud ? 0.32 : 0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.06);
  }
  function snare(t) {
    var s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.18);
  }
  function bass(t, f0, dur) {
    var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f0;
    lp.type = 'lowpass'; lp.frequency.value = 480;
    g.gain.setValueAtTime(0.15, t);
    g.gain.setValueAtTime(0.15, t + dur - 0.03);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur);
  }

  var next = ctx.currentTime + 0.1;
  var step = 0;
  var bassline = [55, 55, 82.4, 55, 65.4, 55, 49, 61.7];
  setInterval(function () {
    if (!audioOn || ctx.state !== 'running') return;
    var s16 = (60 / P.bpm) / 4;
    while (next < ctx.currentTime + 0.12) {
      var bar = Math.floor(step / 16);
      var beat = Math.floor(step / 4) % 4;
      var sub = step % 4;
      // 每8小节休止2小节：只留镲，字塌下去露出骨架
      var breakBar = (bar % 8) >= 6;
      if (sub === 0) {
        barCount = bar;
        inBreak = breakBar;
      }
      if (!breakBar) {
        if (sub === 0) kick(next);
        if (sub === 0 && (beat === 1 || beat === 3)) snare(next);
        if (sub === 0) bass(next, bassline[Math.floor(step / 8) % 8], s16 * 3.5);
      }
      if (sub === 2) hat(next, breakBar);
      next += s16;
      step++;
    }
  }, 24);
}

// ================= 渲染 =================
var lastTag = 0;

function frameLoop(t) {
  var i, s, target;

  if (audioOn && ctx.state === 'running') analyser.getByteFrequencyData(freq);
  kickPulse *= 0.86; // 脉冲衰减

  var playing = audioOn && ctx.state === 'running';
  var skeleton = playing && inBreak; // 休止段：骨架状态

  for (i = 0; i < N; i++) {
    s = state[i];

    // —— 卡机：随机冻结一段时间，冻结期什么都不更新 ——
    if (playing && !skeleton && s.stuckUntil < t && Math.random() < P.stuck) {
      s.stuckUntil = t + 600 + Math.random() * 1900;
    }
    var stuck = s.stuckUntil > t;

    if (!stuck) {
      if (playing && !skeleton) {
        target = (freq[s.band] / 255) * P.sens;
        if (target > 1) target = 1;
      } else if (skeleton) {
        target = 0.02; // 塌下去
      } else {
        target = 0.10 + 0.09 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
      }
      s.v += (target > s.v ? P.atk : P.rel) * (target - s.v);

      if (s.isCN) {
        s.el.style.fontVariationSettings = "'wght' " + Math.round(200 + 700 * s.v);
      } else {
        s.el.style.fontVariationSettings =
          "'wght' " + Math.round(P.wMin + (P.wMax - P.wMin) * s.v) +
          ", 'wdth' " + Math.round(75 + P.wd * s.v);
      }
      s.el.style.transform = 'scaleY(' + (1 + P.sy * s.v) + ')';
      s.el.style.opacity = skeleton ? 0.07 : 1;

      // —— 格子跟着能量变宽窄，踢鼓瞬间再砸一下 ——
      var f = 1 + P.grid * s.v * 0.9 + (s.band < 12 ? kickPulse * P.grid * 0.5 : 0);
      s.cellFlex += 0.3 * (f - s.cellFlex);
      s.cell.style.flexGrow = s.cellFlex.toFixed(3);
    }

    // 骨架线和角标
    s.cell.style.borderColor = skeleton ? 'rgba(17,17,17,0.55)'
      : (playing ? 'rgba(17,17,17,0.06)' : 'rgba(17,17,17,0.14)');
  }

  // 行高也随全局能量微动
  if (playing && !skeleton) {
    var low = (freq[2] + freq[4] + freq[6]) / (3 * 255);
    for (i = 0; i < rowState.length; i++) {
      var r = rowState[i];
      var wob = 1 + P.grid * 0.25 * low * Math.sin(t * 0.002 + i * 1.7);
      r.el.style.flexGrow = (r.base * wob).toFixed(3);
    }
  }

  // 角标文本：每200ms更新一次，骨架时才显眼
  if (t - lastTag > 200) {
    lastTag = t;
    var fw = frame.clientWidth, fh = frame.clientHeight;
    for (i = 0; i < N; i++) {
      s = state[i];
      var showTag = skeleton || !playing;
      s.tag.style.opacity = skeleton ? 0.9 : (playing ? 0 : 0.35);
      if (showTag) {
        s.tag.textContent =
          Math.round(s.cell.clientWidth / fw * 100) + '_' +
          Math.round(s.cell.clientHeight / fh * 100);
      }
    }
  }

  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

// ================= 点击开/关声音 =================
var hint = document.getElementById('hint');

document.body.addEventListener('click', function (e) {
  if (e.target.closest('.debug')) return;
  if (!audioOn) {
    startAudio();
    audioOn = true;
    hint.textContent = '再点暂停 CLICK TO PAUSE';
    return;
  }
  if (ctx.state === 'running') {
    ctx.suspend().then(function () {
      hint.textContent = '已暂停 点击继续 PAUSED';
    });
  } else {
    ctx.resume().then(function () {
      hint.textContent = '再点暂停 CLICK TO PAUSE';
    });
  }
});

// ================= 调试面板 =================
var dbg = document.getElementById('debug');
document.addEventListener('keydown', function (e) {
  if (e.key === 'd' || e.key === 'D') dbg.classList.toggle('on');
});
function bind(id, key) {
  var input = document.getElementById('p-' + id);
  var label = document.getElementById('v-' + id);
  input.value = P[key];
  label.textContent = P[key];
  input.addEventListener('input', function () {
    P[key] = parseFloat(input.value);
    label.textContent = input.value;
  });
}
bind('sens', 'sens'); bind('atk', 'atk'); bind('rel', 'rel');
bind('grid', 'grid'); bind('stuck', 'stuck');
bind('wmax', 'wMax'); bind('wd', 'wd'); bind('bpm', 'bpm');
</script>
</body>
</html>
